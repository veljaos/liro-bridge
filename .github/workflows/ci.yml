name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # **This job installs no GTK, and that absence is the thing it
      # proves.** D-334 installed the development packages here instead,
      # and the push after it still went red — on a *third* pkg-config
      # name, gobject-introspection-1.0, which no `apt-get install
      # libgtk-4-dev` supplies and which turns out to live in a package
      # called `gobject-introspection` rather than in any `-dev` one.
      # Adding a third package would have turned this green and given up
      # what the job is for, so the boundary moved instead of the apt
      # line. [[D-335]].
      #
      # What the job proves, by compiling with no GTK present at all:
      # every package in this module except internal/ui is free of C
      # dependencies on linux, which is F0 §10's rule and SPEC §1.1's
      # "only what needs it gets it". internal/ui and its cgo half are
      # the linux-gui job below.
      #
      # The exclusion is computed rather than typed, and then *asserted*,
      # which is the difference between a filter and a guard: a filter
      # that silently grows is how a package acquiring a GTK dependency
      # would quietly leave this job's sweeps instead of failing them.
      # Both views are checked, because the softtoken view is the one
      # that surprised: cmd/liro-bridge pulled the whole GTK stack
      # through internal/pinscreen under `-tags softtoken` and through
      # nothing at all without it.
      # **Three packages now, and each arrival was a section of F12
      # landing rather than a regression.** internal/ui is the window
      # host; cmd/liro-bridge is the agent, which since D-338 opens those
      # windows on linux and therefore links what they link; and
      # internal/pinscreen joined with D-350, because F12 §5's PIN dialog
      # is a native GTK window and this is the package that opens it.
      # SPEC §1.1 says the first two in as many words — "on Linux the
      # binary is dynamically linked against the system's WebKitGTK, its
      # GTK stack and libc" — and SPEC §10 says the third: one window in
      # this program is native rather than HTML, and a package that opens
      # a window links what a window links.
      #
      # **The list is the argument, not the count.** Every name in it has
      # to be a package whose job is to put something on a screen. A
      # fourth entry that is not is how a GTK stack ends up behind code
      # that ships without one — and the answer then is not to widen this
      # list but to find out why something that is not a window grew a
      # window dependency (D-335's own case was one symbol in one file).
      - name: only the window packages and the agent need GTK on linux
        run: |
          set -eu
          ui=github.com/veljaos/liro-bridge/internal/ui
          expected="$(printf '%s\n%s\n%s' \
            github.com/veljaos/liro-bridge/cmd/liro-bridge \
            github.com/veljaos/liro-bridge/internal/pinscreen \
            github.com/veljaos/liro-bridge/internal/ui)"

          needs_ui() {
            go list "$@" -f '{{.ImportPath}}{{range .Deps}}{{if eq . "'"$ui"'"}} needs-ui{{end}}{{end}}' ./... |
              awk -v ui="$ui" '$1 == ui || $2 == "needs-ui" { print $1 }' | sort
          }

          for view in "untagged" "-tags softtoken"; do
            case "$view" in untagged) found="$(needs_ui)" ;; *) found="$(needs_ui $view)" ;; esac
            if [ "$found" != "$expected" ]; then
              echo "FAIL: in the $view view, the packages needing GTK on linux are:"
              echo "$found"
              echo "Expected exactly:"
              echo "$expected"
              echo
              echo "A package whose job is not to put something on a screen has"
              echo "acquired a window dependency. That is not a CI problem to widen"
              echo "this list for: it puts a GTK stack behind code that ships"
              echo "without one (SPEC §1.1). See D-335, D-338 and D-350."
              exit 1
            fi
            echo "OK: $view — exactly the window host and the agent"
          done

          go list ./... | grep -vxF "$expected" > "$RUNNER_TEMP/gtk-free-packages.txt"
          echo "$(wc -l < "$RUNNER_TEMP/gtk-free-packages.txt") packages sweep without GTK"

          # **A second boundary, and it is not the same one.** "Needs
          # GTK" and "needs a C toolchain" were one set until D-349:
          # internal/keysource/pkcs11 is cgo on linux now and links no
          # GTK at all. So the CGO_ENABLED=0 build below sweeps the
          # packages that can be built that way, which is everything
          # except the two roots and what depends on them — computed
          # here rather than listed, so it follows the code instead of
          # having to be remembered (D-353).
          p11=github.com/veljaos/liro-bridge/internal/keysource/pkcs11
          go list -f '{{.ImportPath}}{{range .Deps}}{{if eq . "'"$p11"'"}} needs-p11{{end}}{{end}}' ./... |
            awk -v p="$p11" '$1 == p || $2 == "needs-p11" { print $1 }' | sort > "$RUNNER_TEMP/needs-p11.txt"
          grep -vxF -f "$RUNNER_TEMP/needs-p11.txt" "$RUNNER_TEMP/gtk-free-packages.txt" \
            > "$RUNNER_TEMP/cgo-free-packages.txt"
          echo "$(wc -l < "$RUNNER_TEMP/cgo-free-packages.txt") packages build with no C toolchain at all"
          echo "packages needing the PKCS#11 loader's cgo on linux:"
          cat "$RUNNER_TEMP/needs-p11.txt"

      # **The one C header this job installs, and it is not a
      # contradiction.** This job exists to prove that nothing shipped
      # needs a GTK stack on linux (D-335), and libp11-kit is not one:
      # SPEC §1.1 permits dynamic linkage "for the webview **and the
      # PKCS#11 module loader**, and for nothing else", so the module
      # loader having a C dependency is the specification's own shape
      # rather than a widening of this job's claim. The build step at
      # the end of this job still runs with CGO_ENABLED=0, over every
      # package that can be built that way (D-353).
      - name: the PKCS#11 header
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libp11-kit-dev

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files (see above)"
            exit 1
          fi

      - name: go vet
        # unsafeptr is disabled project-wide: internal/ui's hand-written
        # COM vtable implementations (F5 §2.1) must reinterpret the raw
        # "this" machine word a callback receives from foreign code as a
        # *T — the exact pattern this analyzer exists to catch for
        # accidental misuse, but unavoidable and correct for implementing
        # a native callback ABI (verified: isolating the conversion in
        # its own helper function does not change vet's verdict, since
        # the check is per-expression, not per-package). See D-080.
        #
        # The package list is the guard step's, not `./...`: internal/ui
        # is cgo against WebKitGTK and there is no GTK on this runner by
        # design (D-335). It is vetted in linux-gui instead, so nothing
        # loses a vet — the sweep is split between two jobs rather than
        # narrowed.
        run: go vet -unsafeptr=false $(cat "$RUNNER_TEMP/gtk-free-packages.txt")

      # golangci-lint-action v6 installs golangci-lint v1 and cannot read
      # this repository's v2 config schema (.golangci.yml's `version: "2"`,
      # D-009/D-022) — that mismatch is what failed the Ubuntu job after
      # 36 seconds (F6 §0d). v7 was the first to support v2, v9 is
      # current and requires golangci-lint >= v2.1.0.
      #
      # The version is pinned, not `latest`, so CI lints with exactly
      # what a developer runs locally: `latest` means CI's verdict can
      # change overnight with no commit, which is how a lint rule
      # arrives as a mysterious red build on an unrelated change.
      # **Only the GOOS=windows view runs here; the GOOS=linux one is in
      # linux-gui.** golangci-lint loads every package it is pointed at
      # — there is no "lint all of this except that one" — so the linux
      # view needs a GTK stack and this job deliberately has none
      # (D-335).
      #
      # Both views still run on every push, and each sees code the other
      # cannot: GOOS=linux is the only one that compiles the *_other.go
      # fallbacks and internal/ui's GTK4 host, GOOS=windows the only one
      # that compiles the COM/WebView2 layer, the tray and
      # cmd/liro-bridge's window code — which is most of what this
      # project currently is. Linting one view only is the blind spot
      # D-088 had to fix for tests, and the first genuinely-working lint
      # run found ten dead symbols in a package nobody had ever linted
      # from the side that uses them (D-111).
      - name: golangci-lint (GOOS=windows)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
        env:
          GOOS: windows
          GOARCH: amd64

      - name: dependency rule check
        run: go run ./scripts/checkdeps

      # F5 §4.2: a hex colour literal anywhere in the agent's CSS is a
      # lint failure, not a warning — enforced by a checker we own, the
      # same discipline as the dependency-rule check above.
      - name: CSS token rule check
        run: go run ./scripts/checkcss

      - name: test
        run: go test $(cat "$RUNNER_TEMP/gtk-free-packages.txt") -race -count=1
        env:
          # -race requires cgo. This is orthogonal to CGO_ENABLED=0 below:
          # that keeps our own code cgo-free (F0 §10), this just lets the
          # race detector's instrumentation build.
          CGO_ENABLED: 1

      # The soft token (F2 §3) only compiles in with this tag — run its
      # own tests, plus everything else, under it too, so a regression
      # there is caught the same way as everywhere else.
      #
      # This view is why the guard step checks two of them: until D-335,
      # cmd/liro-bridge reached internal/ui *only* under this tag, through
      # internal/pinscreen, so the GTK requirement appeared here and
      # nowhere else. A dependency that exists in one build view is the
      # hardest kind to notice.
      #
      # **That coupling is back as of D-350, and this time it is meant.**
      # internal/pinscreen reaches internal/ui in both views now, because
      # F12 §5's PIN dialog is a native GTK window and pinscreen is what
      # opens it. What D-335 removed was a reference from a function
      # whose whole body is a refusal; what is here now is a window. The
      # guard checking both views is what tells those two apart.
      - name: test (softtoken tag)
        run: go test -tags softtoken $(cat "$RUNNER_TEMP/gtk-free-packages.txt") -race -count=1
        env:
          CGO_ENABLED: 1

      # F3 §16.5/SPEC §16.5: the PDF parser accepts foreign input and must
      # never panic, allocate unboundedly, or loop forever on it. 60s per
      # push/PR is a floor, not a substitute for the longer local runs
      # this phase's report cites (12.6M+18M executions clean) — it exists
      # so a future regression is caught automatically, not only when
      # someone remembers to fuzz by hand again.
      - name: fuzz internal/pades/pdf.FuzzParse
        run: go test ./internal/pades/pdf/... -run=^$ -fuzz=FuzzParse -fuzztime=60s
        env:
          CGO_ENABLED: 0

      # Cross-compilation must work from day one (F0 §8), even though only
      # Windows has a real implementation so far. CGO_ENABLED=0 here keeps
      # these builds honest about not depending on a C toolchain, per the
      # "no cgo until phase 11" rule in F0 §10.
      - name: build windows/amd64
        run: go build -o dist/ ./...
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64

      - name: build darwin/arm64
        run: go build -o dist/ ./...
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64

      # **linux is the guard step's package list where the other two are
      # ./..., and that is a decision rather than a slip.** internal/ui's
      # window host is cgo-only on this platform, so under CGO_ENABLED=0
      # its gotk4 imports have no buildable Go files at all and `./...`
      # fails with "build constraints exclude all Go files" — a cgo-*off*
      # problem that no package installed anywhere can fix. It is a
      # different failure from a missing pkg-config file and the two look
      # alike in a log (D-334).
      #
      # What this step proves: every package this project ships on linux
      # that can compile without a C toolchain still does, which is F0
      # §10's rule and the binary half of SPEC §1.1. The excluded list is
      # computed by the guard step above rather than written here, so it
      # follows the boundary instead of having to be remembered — which
      # matters now that the boundary has moved twice (D-338, D-350).
      #
      # **D-334 narrowed this to ./cmd/... and gave up the cgo-free check
      # for every other package on linux; D-335 gives it back**, because
      # the list is now everything except the one package that genuinely
      # cannot be in it. A linux-tagged file in any other package quietly
      # acquiring a C dependency fails here again, which is what F0 §10
      # is for.
      - name: build linux/amd64
        run: go build -o dist/ $(cat "$RUNNER_TEMP/cgo-free-packages.txt")
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64

  # **The other half of the boundary the `ci` job draws.** internal/ui is
  # the one package in this module that needs a GTK stack on linux
  # (D-335), so it is the one package this job exists for: everything
  # that must compile C lives here, and nothing that ships does.
  #
  # Why a second job rather than three more apt packages in the first
  # one: the first job's *absence* of GTK is what proves the shipped
  # code needs none, and a job cannot prove that while installing it.
  # D-334 tried the other arrangement and the claim went unproven for
  # exactly one push. The two jobs also run in parallel, so the race
  # detector's verdict on the other 50 packages no longer waits behind a
  # fifteen-minute gotk4 build.
  linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go's own cache key is the same string in both ubuntu
          # jobs — same OS, same Go version, same go.sum — so whichever
          # finishes first saves it and the other's save is refused. That
          # would be `ci`, whose cache holds no gotk4 objects at all, and
          # this job would then pay D-327's cold build (14 m 52 s on four
          # CPUs) on every single push. Hence its own key below.
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-gui-go-${{ hashFiles('**/go.sum') }}
          restore-keys: linux-gui-go-

      # **Three packages, and the third is the one D-334 could not see.**
      # libgtk-4-dev and libwebkitgtk-6.0-dev are what gotk4's own cgo
      # lines name most of; `gobject-introspection` carries
      # gobject-introspection-1.0.pc, which gotk4/pkg/core/gerror needs
      # and which neither of the other two pulls in — measured with
      # apt-cache, and measured again as the reason the push after D-334
      # still failed.
      #
      # It is `gobject-introspection` and not `libgirepository1.0-dev`:
      # the .pc file is in the tools package, the -dev package merely
      # depends on it, and naming the -dev one costs the gir1.2-*
      # packages for nothing. Recursive closure: 618 packages for the
      # first two, 677 with this one added.
      #
      # On the development VM this dependency was satisfied by a
      # hand-unpacked prefix on PKG_CONFIG_PATH, which is precisely why
      # no measurement taken there could report it missing (D-335).
      # **libp11-kit-dev is the fourth and it is not a GTK package.**
      # internal/keysource/pkcs11 is cgo on linux as of D-349 — F12 §1
      # requires the platform's own pkcs11.h rather than a second
      # hand-written layout, because F11 measured three of four
      # candidate layouts returning CKR_OK with a zero length. The
      # header comes from libp11-kit-dev and the runner had never
      # needed one, which is D-334's shape a third time: a development
      # package this machine has and the runner does not (D-353).
      - name: GTK4, WebKitGTK, gobject-introspection and the PKCS#11 header
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev gobject-introspection libp11-kit-dev

      # Both of these cover the GOOS=linux view that the `ci` job cannot:
      # vet for internal/ui itself, and golangci-lint for the whole
      # module, since it loads every package it is pointed at and cannot
      # be told to skip one.
      - name: go vet (the two packages that link GTK)
        run: go vet -unsafeptr=false ./internal/ui/... ./internal/pinscreen/... ./cmd/liro-bridge/...

      - name: golangci-lint (GOOS=linux)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # No -race here, and the step below says why rather than leaving it
      # to be rediscovered. This is the run that gates: it must pass.
      - name: test (the two packages that link GTK)
        run: go test ./internal/ui/... ./internal/pinscreen/... ./cmd/liro-bridge/... -count=1

      # Two things must be impossible to enable in a release build, and
      # this checks the binary rather than trusting either build tag.
      #
      #   internal/keysource/softtoken   F2 §7.3 / SPEC §16.6
      #   internal/cli.RunSignWithoutConsent
      #   internal/cli.RunSignDigest
      #                                  SPEC §18.2: no signature without
      #                                  human approval, and no flag,
      #                                  configuration or header bypasses
      #                                  the consent screen.
      #
      # The second used to be proved only incidentally — it was reachable
      # as `liro-bridge sign` and nothing looked for it — and it is named
      # here so that a future change putting it back into a release build
      # goes red for the reason it is wrong, not for a symbol that
      # happens to travel with it.
      #
      # The third is the same defect one command over (D-227): a
      # signature over an attacker-chosen digest is a signature over an
      # attacker-chosen document, and SPEC §6.6's consent screen cannot
      # be built in front of a digest, which has no document count, no
      # file names and no batch to fingerprint.
      #
      # Both directions are checked. A check that only looks for absence
      # passes for the wrong reason the moment the build tag itself
      # breaks: a typo turning `//go:build softtoken` into an ordinary
      # comment would make the symbols vanish even WITH the tag, and the
      # "absent" half would stay green forever.
      - name: the soft token and the no-consent signing paths are absent from a release build
        run: |
          set -eu
          symbols='internal/keysource/softtoken internal/cli.RunSignWithoutConsent internal/cli.RunSignDigest'

          go build -o dist/liro-bridge-no-softtoken ./cmd/liro-bridge
          go tool nm dist/liro-bridge-no-softtoken > dist/nm-release.txt
          go build -tags softtoken -o dist/liro-bridge-with-softtoken ./cmd/liro-bridge
          go tool nm dist/liro-bridge-with-softtoken > dist/nm-tagged.txt

          for sym in $symbols; do
            if grep -q "$sym" dist/nm-release.txt; then
              echo "FAIL: a release-shaped binary contains $sym"
              grep "$sym" dist/nm-release.txt | head
              exit 1
            fi
            echo "OK: no $sym in a release-shaped build"

            if ! grep -q "$sym" dist/nm-tagged.txt; then
              echo "FAIL: $sym is missing even WITH the softtoken tag — this check's own methodology is broken"
              exit 1
            fi
            echo "OK: $sym is present when the tag is passed"
          done
        env:
          # No CGO_ENABLED: 0 any more, and that is the point of the move:
          # since D-338 the linux agent links WebKitGTK (SPEC §1.1), so a
          # step that builds it cannot be a step that forbids a C toolchain.
          CGO_ENABLED: 1
      # This is F2's exit condition (F2 §6.1): a signature produced by
      # sign-digest verifies with OpenSSL, a tool that shares no code
      # with this project, with no hardware present at all.
      #
      # It runs against the softtoken build, which since F9b is the only
      # build that has `sign-digest` at all (D-227). Nothing about this
      # step changed: it already built and used dist/liro-bridge-softtoken.
      - name: sign-digest verifies with OpenSSL against the soft token
        run: |
          go build -tags softtoken -o dist/liro-bridge-softtoken ./cmd/liro-bridge
          go run ./scripts/gentestkeys /tmp/softtoken

          export LIRO_SOFTTOKEN_P12=/tmp/softtoken/test.p12
          export LIRO_SOFTTOKEN_PASSWORD=liro-softtoken-test
          export LOCALAPPDATA=/tmp/liro-appdata
          export HOME=/tmp/liro-home
          export XDG_CONFIG_HOME=/tmp/liro-home/config

          echo "liro-bridge F2 CI verification" > /tmp/input.txt
          DIGEST=$(openssl dgst -sha256 /tmp/input.txt | awk '{print $2}')

          THUMBPRINT=$(dist/liro-bridge-softtoken certs --json | jq -r '.certificates[] | select(.isTestKey==true) | .thumbprint')
          test -n "$THUMBPRINT"

          dist/liro-bridge-softtoken certs --json | jq -r --arg tp "$THUMBPRINT" \
            '.certificates[] | select(.thumbprint == $tp) | .pem' > /tmp/cert.pem

          dist/liro-bridge-softtoken sign-digest --thumbprint "$THUMBPRINT" --digest "$DIGEST" --out /tmp/sig.bin

          openssl x509 -in /tmp/cert.pem -pubkey -noout > /tmp/pub.pem
          openssl dgst -sha256 -verify /tmp/pub.pem -signature /tmp/sig.bin /tmp/input.txt | tee /tmp/verify.out
          grep -q "Verified OK" /tmp/verify.out
        env:
          # No CGO_ENABLED: 0 any more, and that is the point of the move:
          # since D-338 the linux agent links WebKitGTK (SPEC §1.1), so a
          # step that builds it cannot be a step that forbids a C toolchain.
          CGO_ENABLED: 1
      # F3's own exit condition, automated the same way F2's was: sign a
      # PDF with the soft token (no hardware, no network credential
      # needed for this step — B-B, no TSA), and check the result with
      # OpenSSL, a tool sharing no code with this project, exactly like
      # F2 §6.1's sign-digest check. This is this project's own
      # independent verifier's job too, run right after for the same
      # reason F3 §16.4 asks for it in CI.
      #
      # It signs through `sign-no-consent`, not `sign`. `sign` shows the
      # consent window in every build (SPEC §18.2/§4.3) and there is no
      # human on a CI runner; the path with no window exists only in a
      # build made with the softtoken tag, under a name that says what
      # it is, and the step above proves a release binary does not carry
      # it.
      - name: sign a PDF and verify it with OpenSSL and the independent verifier
        run: |
          go build -tags softtoken -o dist/liro-bridge-softtoken ./cmd/liro-bridge
          go run ./scripts/gentestkeys /tmp/softtoken

          export LIRO_SOFTTOKEN_P12=/tmp/softtoken/test.p12
          export LIRO_SOFTTOKEN_PASSWORD=liro-softtoken-test
          export LOCALAPPDATA=/tmp/liro-appdata
          export HOME=/tmp/liro-home
          export XDG_CONFIG_HOME=/tmp/liro-home/config

          mkdir -p dist/ci-helpers/genpdf dist/ci-helpers/extract
          cat > dist/ci-helpers/genpdf/main.go << 'GOEOF'
          package main

          import (
          	"fmt"
          	"os"
          )

          // A minimal, valid, classic-xref PDF — the same shape this
          // project's own tests build (internal/pades/pdf's fixtures_test.go
          // and internal/pades's own test helpers), with byte offsets
          // computed here rather than hand-typed in a shell heredoc.
          func main() {
          	var buf []byte
          	offsets := map[int]int{}
          	write := func(num int, body string) {
          		offsets[num] = len(buf)
          		buf = append(buf, []byte(fmt.Sprintf("%d 0 obj\n%s\nendobj\n", num, body))...)
          	}
          	buf = append(buf, []byte("%PDF-1.4\n")...)
          	write(1, "<< /Type /Catalog /Pages 2 0 R >>")
          	write(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>")
          	write(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> /Contents 4 0 R >>")
          	content := "BT /F1 12 Tf 72 712 Td (Hello) Tj ET"
          	offsets[4] = len(buf)
          	buf = append(buf, []byte(fmt.Sprintf("4 0 obj\n<< /Length %d >>\nstream\n%s\nendstream\nendobj\n", len(content), content))...)
          	xrefStart := len(buf)
          	buf = append(buf, []byte("xref\n0 5\n0000000000 65535 f \n")...)
          	for i := 1; i <= 4; i++ {
          		buf = append(buf, []byte(fmt.Sprintf("%010d %05d n \n", offsets[i], 0))...)
          	}
          	buf = append(buf, []byte(fmt.Sprintf("trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF", xrefStart))...)
          	if err := os.WriteFile(os.Args[1], buf, 0o644); err != nil {
          		panic(err)
          	}
          }
          GOEOF
          go run ./dist/ci-helpers/genpdf /tmp/input.pdf

          THUMBPRINT=$(dist/liro-bridge-softtoken certs --json | jq -r '.certificates[] | select(.isTestKey==true) | .thumbprint')
          test -n "$THUMBPRINT"

          # --on-tsa-failure b-b because this step deliberately configures
          # no timestamp authority. Since D-067, "a level was requested and
          # no TSA is configured" is a failure rather than a silent
          # downgrade (SPEC §18.11), and --level defaults to b-lt — so
          # without this flag the command correctly aborts. The flag is
          # how a caller says "B-B is what I want here", which is exactly
          # what this step means.
          dist/liro-bridge-softtoken sign-no-consent --in /tmp/input.pdf --out /tmp/signed.pdf --thumbprint "$THUMBPRINT" --force --on-tsa-failure b-b

          cat > dist/ci-helpers/extract/main.go << 'GOEOF'
          package main

          import (
          	"fmt"
          	"os"

          	"github.com/veljaos/liro-bridge/internal/pades/verify"
          )

          func main() {
          	data, err := os.ReadFile(os.Args[1])
          	if err != nil {
          		panic(err)
          	}
          	slots, err := verify.FindSignatures(data)
          	if err != nil || len(slots) != 1 {
          		panic(fmt.Sprintf("FindSignatures: %v (slots=%d)", err, len(slots)))
          	}
          	r := verify.VerifySignature(data, slots[0])
          	if len(r.Errors) > 0 || !r.ByteRangeDigestOK || !r.SignatureOK || !r.SigningCertificateOK {
          		panic(fmt.Sprintf("independent verifier rejected the signature: %+v errors=%v", r, r.Errors))
          	}
          	fmt.Println("independent verifier: OK")

          	b, c, d := slots[0].ByteRange[1], slots[0].ByteRange[2], slots[0].ByteRange[3]
          	if err := os.WriteFile(os.Args[2], slots[0].CMS, 0o644); err != nil {
          		panic(err)
          	}
          	content := append(append([]byte{}, data[:b]...), data[c:c+d]...)
          	if err := os.WriteFile(os.Args[3], content, 0o644); err != nil {
          		panic(err)
          	}
          }
          GOEOF
          go run ./dist/ci-helpers/extract /tmp/signed.pdf /tmp/sig.der /tmp/sig.content

          openssl cms -verify -inform DER -in /tmp/sig.der -noverify -binary -content /tmp/sig.content -out /dev/null
        env:
          # No CGO_ENABLED: 0 any more, and that is the point of the move:
          # since D-338 the linux agent links WebKitGTK (SPEC §1.1), so a
          # step that builds it cannot be a step that forbids a C toolchain.
          CGO_ENABLED: 1

      # **SPEC §1.1's own test, on the artefact it is about.** The
      # clause says it in as many words: "the test is what the binary
      # links against, never which flag built it ... what it requires is
      # that the claim be checked against the binary's own PT_INTERP and
      # DT_NEEDED, and that the packaging declare every library found
      # there."
      #
      # Until D-338 this project proved the opposite thing on linux — a
      # CGO_ENABLED=0 build with DT_NEEDED 0 — because the agent had no
      # windows here and needed no C. It has them now, so the honest
      # check is not that the list is empty but that it is exactly the
      # thirteen D-327 measured, no more. A fourteenth would be a
      # dependency nobody declared, which is what §8's packaging line is
      # generated from.
      - name: the agent links exactly the libraries SPEC §1.1 and F12 §8 account for
        run: |
          set -eu
          go build -o dist/liro-bridge-linux ./cmd/liro-bridge

          expected="libc.so.6 libcairo-gobject.so.2 libcairo.so.2 libgdk_pixbuf-2.0.so.0 libgio-2.0.so.0 libglib-2.0.so.0 libgobject-2.0.so.0 libgraphene-1.0.so.0 libgtk-4.so.1 libjavascriptcoregtk-6.0.so.1 libpango-1.0.so.0 libsoup-3.0.so.0 libwebkitgtk-6.0.so.4"
          # LC_ALL=C, and it is not decoration: with the runner's own
          # locale, sort collates punctuation loosely and puts
          # libcairo-gobject.so.2 before libc.so.6, so the same thirteen
          # libraries compare unequal to the same thirteen libraries.
          # Measured, by this check failing on a machine whose list was
          # right.
          found="$(readelf -d dist/liro-bridge-linux | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"

          echo "DT_NEEDED: $found"
          if [ "$found" != "$expected" ]; then
            echo "FAIL: the agent's dynamic dependencies are not the set F12 §8 declares."
            echo "expected: $expected"
            echo "found:    $found"
            exit 1
          fi

          if ! readelf -l dist/liro-bridge-linux | grep -q INTERP; then
            echo "FAIL: no PT_INTERP — this binary is static, which on linux means"
            echo "the window layer is not in it and something linked less than it should."
            exit 1
          fi
          echo "OK: thirteen libraries and an interpreter, which is what §1.1 permits and §8 declares"

      # **A probe, not a gate** — it cannot fail this job, and a green
      # tick on it means only that it ran.
      #
      # `-race` implies `checkptr`, and D-330 measured gotk4's object
      # interning doing pointer arithmetic checkptr rejects, from inside
      # one ordinary GTK call. The linux UI tests skip themselves on a
      # headless runner ("no windowing system"), so they may well never
      # reach a GTK call and pass — but that is a runtime skip rather
      # than a compile-time exclusion and it has never been observed on a
      # runner (D-334's own open question). This step answers it in the
      # log without holding a phase hostage to the answer.
      #
      # If it dies with "checkptr: pointer arithmetic result points to
      # invalid allocation", the remedy is -gcflags=all=-d=checkptr=0 and
      # the decision to make is whether internal/ui is race-checked at
      # all. Read the output; do not read the tick.
      - name: probe — do the GTK packages survive -race, given gotk4 and checkptr
        continue-on-error: true
        #
        # -v, and only here: the first run of this step printed `ok
        # internal/ui 1.088s` and nothing else, which is too fast to have
        # opened a window and therefore says the GTK tests skipped — but
        # says it by inference. The gate above does not need to know why
        # it passed; a probe does.
        run: |
          set +e
          go test ./internal/ui/... ./internal/pinscreen/... ./cmd/liro-bridge/... -race -count=1 -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PROBE: internal/ui passed under -race (exit 0)."
          else
            echo "PROBE: internal/ui did NOT pass under -race (exit $status)."
            echo "See D-330 and D-334. This step is a probe and does not fail the job."
          fi

  # windows-latest is the only runner that actually compiles and runs
  # this project's *_windows.go files (internal/ui's COM/WebView2 host,
  # the tray, cmd/liro-bridge's interactive/settings/certificates/audit
  # log windows). The ubuntu job above cross-compiles windows/amd64
  # (build windows/amd64, above) but a cross-compiled build is never
  # executed, so it proves the package compiles, not that a window ever
  # renders or that a click ever reaches Go — every one of the F5
  # first-real-run findings this job exists to catch (empty window
  # text: the Go-level view-model tests passed while ExecuteScript
  # raced Navigate; approve/cancel silently dropped: bridge.js's
  # postMessage(JSON.stringify(...)) double-encoded every page->Go
  # message) lived entirely in code this project's CI had never once
  # built with GOOS=windows, let alone run. See docs/decisions.md.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet -unsafeptr=false ./...

      - name: test (real WebView2 windows, no hardware)
        # -tags softtoken so the interactive consent/sign path
        # (cmd/liro-bridge's *_windows_test.go) can exercise a real
        # window, a real certificate list and a real signature with no
        # smart card present — the same soft token the ubuntu job's
        # sign-digest/PDF-signing steps already rely on for the same
        # reason (F2 §3). windows-latest ships the WebView2 Evergreen
        # Runtime (bundled with Microsoft Edge) that every window this
        # test suite creates depends on.
        run: go test -tags softtoken ./... -count=1
        env:
          CGO_ENABLED: 0
          # The agent says why it gave up in its own log, and until now
          # not one line of that log reached this job. config.SetupLogging
          # slog.SetDefault()s a JSON handler over a file under
          # LOCALAPPDATA, which the suite points at a temporary directory
          # it then deletes — so a Windows failure arrived here as a
          # symptom with its cause thrown away, and the only remedy was to
          # re-run it. LIRO_DEBUG=1 is the switch F0 §10 already defines
          # for exactly this (text to stderr as well as JSON to the file);
          # setting it here is what makes a red Windows job readable
          # (D-237).
          LIRO_DEBUG: 1

      # The log file too, not only what stderr carried: a failed test now
      # keeps its config home (tempConfigHome), and that directory holds
      # the agent's JSON log, its audit chain and its config as the run
      # left them — more than stderr can carry. An artifact rather than
      # the job log because reading a job log needs admin rights on the
      # repository and reading an artifact only needs an account
      # (measured, D-237).
      - name: collect the agent's own state from a failed run
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-agent-state
          n=0
          for d in "${TEMP:-/tmp}"/liro-config-* "${RUNNER_TEMP:-/tmp}"/liro-config-*; do
            [ -d "$d/Liro" ] || continue
            cp -r "$d/Liro" "ci-agent-state/$(basename "$d")"
            n=$((n + 1))
          done
          echo "collected $n config home(s)"
          find ci-agent-state -type f -printf '%s\t%p\n' 2>/dev/null || true

      - name: upload the agent's own state from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liro-agent-state-windows
          path: ci-agent-state
          if-no-files-found: warn
          retention-days: 14

      # D-221 closed a defect in the packaging test — it resolved
      # npm-cli.js by assuming the Windows layout, which is wrong on
      # every other operating system — and recorded that the fix left a
      # gap pointing the other way: this job ran Go only, so
      # sdk-typescript on ubuntu-latest was the only place that suite
      # ran anywhere. Both npm-cli.js layouts resolve now, but the
      # Windows branch was exercised by a person and the POSIX branch by
      # CI, which is exactly the defect D-221 records with the platforms
      # swapped. A check that only runs where it was written is not
      # evidence about where it will run.
      #
      # The version is pinned rather than taken as latest, for the reason
      # the golangci-lint comment above already gives: CI's verdict must
      # not change overnight with no commit. It is the same version the
      # sdk-typescript job pins, so the two jobs test the same Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: install the build tools (SDK)
        working-directory: sdk/typescript
        run: npm ci

      - name: the committed dist/ is what src/ produces (Windows)
        working-directory: sdk/typescript
        run: npm run check-build

      - name: test (SDK, Windows)
        working-directory: sdk/typescript
        run: npm test

  # The packaging build, on every push.
  #
  # Until this job existed, build/msi ran in exactly one place: the
  # release workflow, on a tag. So the first thing a broken WiX source,
  # a renamed asset or a missing file would break was a release — the
  # one build where a failure costs the most and where nobody has time
  # to read it. That is the same shape as a check that only runs where
  # it was written (D-221), pointed at a build rather than at a test:
  # this one only ran when it was most expensive to be wrong.
  #
  # It builds a development version deliberately. `-Version` is what a
  # release stamps; omitting it exercises the other branch of every
  # version decision in build.ps1 (the binary reports "dev", the MSIs
  # are stamped 0.0.0), and it means this job can never be mistaken for
  # a release or produce something that looks like one.
  packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned by SHA-256 inside build.ps1, so a cache hit and a fresh
      # download are the same bytes or the build fails. The cache is a
      # saving, never a source of truth.
      - name: cache the WiX toolset
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Liro/build/wix314
          key: wix314-${{ runner.os }}-6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31

      - name: build the artefacts
        shell: pwsh
        run: ./build/msi/build.ps1 -Out dist/ci

      # Inspecting what the build produced is not enough on its own —
      # this project has recorded that four times (D-161, D-200, D-219,
      # D-221) — but it is what a hosted runner can do: it has no
      # reader, no card, and installing per-machine would need
      # elevation. So this asserts the three things that are true of the
      # artefacts themselves, and the report says plainly that a real
      # install is verified by hand on a real machine, not here.
      - name: the three artefacts are there and the binary runs
        shell: bash
        run: |
          set -eu
          for f in liro-bridge-dev-x64.msi liro-bridge-dev-x64-per-machine.msi liro-bridge-dev-x64.exe; do
            test -s "dist/ci/$f" || { echo "::error::dist/ci/$f is missing or empty"; exit 1; }
            printf '  %-44s %10d bytes\n' "$f" "$(stat -c%s "dist/ci/$f")"
          done
          got="$(./dist/ci/liro-bridge-dev-x64.exe --version)"
          echo "$got"
          case "$got" in
            "liro-bridge dev "*) ;;
            *) echo "::error::an unversioned build reports '$got', which should begin with 'liro-bridge dev'"; exit 1 ;;
          esac

      # An MSI that Windows Installer itself will not read is a file
      # every ICE check in build.ps1 has already passed over, so the
      # summary information stream is read here through the same COM
      # interface the installer uses.
      - name: Windows Installer can read both packages
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          foreach ($msi in Get-ChildItem dist/ci -Filter *.msi) {
              $db = $installer.GetType().InvokeMember(
                  "OpenDatabase", "InvokeMethod", $null, $installer, @($msi.FullName, 0))
              $si = $db.GetType().InvokeMember("SummaryInformation", "GetProperty", $null, $db, @(0))
              $subject  = $si.GetType().InvokeMember("Property", "GetProperty", $null, $si, @(3))
              $template = $si.GetType().InvokeMember("Property", "GetProperty", $null, $si, @(7))
              Write-Host ("{0,-44} {1} [{2}]" -f $msi.Name, $subject, $template)
              if (-not $template) { throw "$($msi.Name) has no platform/language template" }
          }

  # F12 §8: the .deb and the .rpm, built the way a release builds them.
  #
  # **Inside ubuntu:24.04, and the container is the point.** A cgo binary
  # takes its glibc symbol versions from the machine that linked it, and
  # the runner is whatever `ubuntu-latest` is this month. 24.04 is the
  # oldest distribution this program supports (F12 §3.1), so a binary
  # linked there starts everywhere newer. build.sh checks the property
  # rather than trusting the container: it refuses a binary that needs a
  # glibc newer than 2.39.
  #
  # The container is not a test distribution. What the package needs is
  # measured by the next job, on images that have none of the -dev
  # packages installed here.
  linux-packages:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # git before checkout, so the checkout is a repository and
      # build.sh can stamp the commit; the rest is D-353's list plus
      # dpkg-dev for dpkg-shlibdeps and binutils for objdump.
      - name: the build container's toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gcc libc6-dev pkg-config binutils dpkg-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev gobject-introspection libp11-kit-dev

      - uses: actions/checkout@v4

      - name: the checkout belongs to another uid
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Its own key, for linux-gui's reason: gotk4's cold build is
      # fifteen minutes, and a cache saved by a job that never built it
      # would be restored here holding none of it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-packages-go-${{ hashFiles('**/go.sum') }}
          restore-keys: linux-packages-go-

      - name: nFPM, pinned
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: build the packages
        run: NFPM="$(go env GOPATH)/bin/nfpm" build/linux/build.sh 0.0.0-ci dist/linux

      # SPEC §1.1, on the artefact: "the packaging declare every library
      # found there" — and nothing it does not find, since a library the
      # binary does not name is a defect too. dpkg-shlibdeps is the
      # archive's own tool for reading DT_NEEDED into package names
      # (D-326); the two F12 §9 services are the only things the .deb
      # may add to it.
      - name: the .deb declares exactly what the binary links, plus pcscd and libccid
        run: |
          set -eu
          mkdir -p /tmp/shl/debian
          printf 'Source: x\n\nPackage: x\nArchitecture: amd64\n' > /tmp/shl/debian/control
          generated=$(cd /tmp/shl && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/dist/linux/stage/liro-bridge" 2>/dev/null | sed 's/^shlibs:Depends=//')
          want="$generated, pcscd, libccid"
          got=$(dpkg-deb -f dist/linux/liro-bridge_0.0.0-ci_amd64.deb Depends)
          echo "generated: $want"
          echo "declared:  $got"
          if [ "$got" != "$want" ]; then
            echo "::error::build/linux/nfpm.yaml's deb depends are not what dpkg-shlibdeps reads from the binary"
            exit 1
          fi

      # Package signing (D-356) runs for real only on a tag, in release.yml,
      # and would otherwise be code that has never run when the first
      # release needs it. So every push signs through the same sign.sh with
      # a key made here and thrown away — and the one thing that key must
      # never do is pass as the committed one.
      - name: sign with a throwaway key; the committed key refuses it
        run: |
          set -eu
          apt-get install -y --no-install-recommends gnupg rpm
          export GNUPGHOME="$(mktemp -d)"
          pass="throwaway-$(od -An -N8 -tx1 /dev/urandom | tr -d ' ')"
          gpg --batch --pinentry-mode loopback --passphrase "$pass" \
            --quick-generate-key "Liro CI throwaway" ed25519 sign 1d
          gpg --armor --export "Liro CI throwaway" > dist/linux/throwaway.asc
          key="$(gpg --batch --pinentry-mode loopback --passphrase "$pass" \
            --armor --export-secret-keys "Liro CI throwaway" | base64 -w0)"
          gpgconf --kill gpg-agent
          LIRO_PACKAGE_PUBLIC_KEY=dist/linux/throwaway.asc \
            LIRO_PACKAGE_SIGNING_KEY="$key" LIRO_PACKAGE_SIGNING_PASSPHRASE="$pass" \
            build/linux/sign.sh dist/linux
          if build/linux/verify.sh dist/linux; then
            echo "::error::packages signed with a throwaway key verify against the committed key"
            exit 1
          fi
          echo "the committed key refuses the throwaway signature, as it must"

      # The README tells a person which fingerprint to compare. It has to be
      # the committed key's, and nothing else would notice if it drifted.
      - name: the README states the committed key's fingerprint
        run: |
          set -eu
          fpr="$(gpg --batch --with-colons --show-keys build/linux/liro-bridge-packages.asc | awk -F: '/^fpr/{print $10; exit}')"
          echo "committed key: $fpr"
          grep -q "$fpr" README.md || { echo "::error::README.md does not state $fpr"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/SHA256SUMS
            dist/linux/SHA256SUMS.asc
            dist/linux/throwaway.asc

  # Install, run, remove — on clean images, which is the only way to learn
  # what a package needs rather than what the machine that built it
  # happened to have (D-334, D-335, D-353: three times, the same way).
  #
  # **Fedora is measured here and nowhere else.** There is no Fedora
  # machine in this project; the .rpm's library Requires are sonames,
  # which dnf resolves to Fedora's own package names, and the two F12 §9
  # names are the only guess in it. An install that resolves proves both.
  #
  # What a container cannot show: a window, a sandbox, a card. `--version`
  # and the loader's view of the binary are what it can, and they are the
  # dependency question exactly.
  linux-install:
    needs: linux-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie", "fedora:44"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages

      # The README's own commands, with each distribution's own tools, over
      # packages linux-packages signed with its throwaway key. Whether
      # Fedora's rpm accepts an ed25519 signature Ubuntu's rpmsign made is
      # measured here and nowhere else.
      - name: the README's check passes before install
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends gnupg
            gpg --batch --import throwaway.asc
            gpg --batch --verify SHA256SUMS.asc SHA256SUMS
            sha256sum --check --ignore-missing SHA256SUMS
          else
            rpm --import throwaway.asc
            out="$(rpm -K liro-bridge-0.0.0-ci.x86_64.rpm)"
            echo "$out"
            case "$out" in
              *": digests signatures OK") ;;
              *) echo "::error::rpm does not accept the package's signature"; exit 1 ;;
            esac
          fi

      - name: install the package with the distribution's own tool
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y ./liro-bridge_0.0.0-ci_amd64.deb
          else
            dnf install -y ./liro-bridge-0.0.0-ci.x86_64.rpm
          fi

      - name: every library the binary names resolves, and it runs
        run: |
          set -eu
          if ldd /usr/bin/liro-bridge | grep 'not found'; then
            echo "::error::the package installed and the binary still cannot be loaded"
            exit 1
          fi
          /usr/bin/liro-bridge --version
          command -v pcscd >/dev/null || { echo "::error::no pcscd after install"; exit 1; }

      # F12 §9: "pcscd is socket-activated and has historically been left
      # disabled after install." Whether it is, on a clean image after this
      # package pulled it in, is read here from the enablement symlink
      # itself — what systemd reads at boot, and present whether or not a
      # container runs systemd. Reported, not asserted: D-358 wrote its
      # predictions down first, and the agent tells a person what to type
      # either way.
      - name: is pcscd.socket enabled after install (reported)
        run: |
          link=/etc/systemd/system/sockets.target.wants/pcscd.socket
          if [ -L "$link" ]; then
            echo "::notice::${{ matrix.image }}: pcscd.socket is enabled after install ($(readlink "$link"))"
          else
            echo "::notice::${{ matrix.image }}: pcscd.socket is NOT enabled after install"
          fi

      - name: the desktop entries and the icon are where a desktop looks
        run: |
          set -eu
          for f in /usr/share/applications/liro-bridge.desktop \
                   /usr/share/applications/liro-bridge-open-pdf.desktop \
                   /usr/share/icons/hicolor/48x48/apps/liro-bridge.png \
                   /usr/share/icons/hicolor/256x256/apps/liro-bridge.png; do
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          grep -qx 'MimeType=application/pdf;' /usr/share/applications/liro-bridge-open-pdf.desktop

      # The profile on Debian and Ubuntu, and not on Fedora. Its syntax is
      # checked with the distribution's own parser, without loading it:
      # a container has no kernel of its own to load it into.
      - name: the AppArmor profile ships where it belongs, and parses
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            test -s /etc/apparmor.d/liro-bridge
            apt-get install -y --no-install-recommends apparmor
            apparmor_parser --skip-kernel-load --skip-cache /etc/apparmor.d/liro-bridge
          else
            test ! -e /etc/apparmor.d/liro-bridge
          fi

      # What uninstall keeps is decided in D-354 and it is mostly outside
      # the package's reach — every per-person file is in a home
      # directory. What the package owns has to go, and the AppArmor
      # profile is a conffile: kept on remove, gone on purge.
      - name: remove, then purge
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get remove -y liro-bridge
            test ! -e /usr/bin/liro-bridge
            test -e /etc/apparmor.d/liro-bridge
            apt-get purge -y liro-bridge
            test ! -e /etc/apparmor.d/liro-bridge
          else
            dnf remove -y liro-bridge
            test ! -e /usr/bin/liro-bridge
          fi
          test ! -e /usr/share/applications/liro-bridge.desktop

  # The TypeScript SDK. Its own job rather than steps on the ubuntu one,
  # because it needs Node rather than Go and because a red SDK should
  # say "SDK" rather than sending somebody to read a Go job's log.
  #
  # The committed build output is the load-bearing check here.
  # `sdk/typescript/dist/` is what an integrator gets — installing from
  # GitHub runs no build step — so a `dist/` that is not what `src/`
  # produces ships silently. This project has already had one generated
  # file drift from its generator, and running the generator would have
  # deleted a block five screens depended on (docs/decisions.md D-183).
  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The oldest Node this SDK supports (F8 §2) and the one it is
          # therefore tested on: a suite that only ever runs on the
          # newest Node is not evidence about the version the package
          # says it accepts.
          node-version: '18'

      # `npm ci` rather than `npm install`: package-lock.json is
      # committed and the compiler version is pinned, so the build in CI
      # is the build a developer ran.
      - name: install the build tools
        run: npm ci

      - name: the committed dist/ is what src/ produces
        run: npm run check-build

      - name: test
        run: npm test

      # Zero runtime dependencies is a property, not an aspiration: this
      # package is installed into applications that handle a signing
      # secret, and every dependency here would be one of theirs.
      - name: no runtime dependencies
        run: |
          deps="$(node -p 'JSON.stringify({...require("./package.json").dependencies, ...require("./package.json").peerDependencies})')"
          if [ "$deps" != "{}" ]; then
            echo "the SDK has runtime dependencies: $deps"
            exit 1
          fi

      # The end of the argument: pack the repository root exactly as npm
      # would for `npm install github:veljaos/liro-bridge`, install the
      # tarball into an empty project, and import '@liro/bridge' both
      # ways. A package that passes its own tests and cannot be
      # installed is this project's recurring failure mode, one layer
      # over.
      - name: install it the way an integrator does
        working-directory: .
        run: |
          set -eu
          work="$(mktemp -d)"
          npm pack --silent --pack-destination "$work" . >/dev/null
          cd "$work"
          echo '{"name":"consumer","version":"1.0.0","type":"module","private":true}' > package.json
          npm install --no-audit --no-fund --silent ./liro-bridge-*.tgz
          echo "import { LiroBridge, FileSecretStore, LiroError } from '@liro/bridge';
          if (typeof LiroBridge.connect !== 'function') { throw new Error('no LiroBridge'); }
          if (typeof FileSecretStore !== 'function') { throw new Error('no FileSecretStore'); }
          if (typeof LiroError !== 'function') { throw new Error('no LiroError'); }
          console.log('esm ok');" > use.mjs
          node use.mjs
          echo "const m = require('@liro/bridge');
          if (typeof m.LiroBridge.connect !== 'function') { throw new Error('no LiroBridge'); }
          console.log('cjs ok');" > use.cjs
          node use.cjs
          installed="$(ls node_modules | grep -v '^\.' | tr '\n' ' ')"
          if [ "$installed" != "@liro " ]; then
            echo "installing this package brought other packages with it: $installed"
            exit 1
          fi
