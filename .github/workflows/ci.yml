name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files (see above)"
            exit 1
          fi

      - name: go vet
        # unsafeptr is disabled project-wide: internal/ui's hand-written
        # COM vtable implementations (F5 §2.1) must reinterpret the raw
        # "this" machine word a callback receives from foreign code as a
        # *T — the exact pattern this analyzer exists to catch for
        # accidental misuse, but unavoidable and correct for implementing
        # a native callback ABI (verified: isolating the conversion in
        # its own helper function does not change vet's verdict, since
        # the check is per-expression, not per-package). See D-080.
        run: go vet -unsafeptr=false ./...

      # golangci-lint-action v6 installs golangci-lint v1 and cannot read
      # this repository's v2 config schema (.golangci.yml's `version: "2"`,
      # D-009/D-022) — that mismatch is what failed the Ubuntu job after
      # 36 seconds (F6 §0d). v7 was the first to support v2, v9 is
      # current and requires golangci-lint >= v2.1.0.
      #
      # The version is pinned, not `latest`, so CI lints with exactly
      # what a developer runs locally: `latest` means CI's verdict can
      # change overnight with no commit, which is how a lint rule
      # arrives as a mysterious red build on an unrelated change.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # The step above analyses the GOOS=linux view of this repository,
      # which excludes every *_windows.go file — that is most of what
      # this project currently is: internal/ui's whole COM/WebView2
      # layer, the tray, and cmd/liro-bridge's window code. Linting only
      # the Linux view is the same blind spot D-088 had to fix for
      # tests, and it is why the first genuinely-working lint run found
      # ten dead symbols in a package nobody had ever linted from the
      # side that uses them (D-111).
      #
      # Both views are linted because each sees code the other cannot:
      # GOOS=linux is the only one that compiles the *_other.go
      # fallbacks, GOOS=windows the only one that compiles everything
      # else.
      - name: golangci-lint (GOOS=windows)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
        env:
          GOOS: windows
          GOARCH: amd64

      - name: dependency rule check
        run: go run ./scripts/checkdeps

      # F5 §4.2: a hex colour literal anywhere in the agent's CSS is a
      # lint failure, not a warning — enforced by a checker we own, the
      # same discipline as the dependency-rule check above.
      - name: CSS token rule check
        run: go run ./scripts/checkcss

      - name: test
        run: go test ./... -race -count=1
        env:
          # -race requires cgo. This is orthogonal to CGO_ENABLED=0 below:
          # that keeps our own code cgo-free (F0 §10), this just lets the
          # race detector's instrumentation build.
          CGO_ENABLED: 1

      # The soft token (F2 §3) only compiles in with this tag — run its
      # own tests, plus everything else, under it too, so a regression
      # there is caught the same way as everywhere else.
      - name: test (softtoken tag)
        run: go test -tags softtoken ./... -race -count=1
        env:
          CGO_ENABLED: 1

      # Two things must be impossible to enable in a release build, and
      # this checks the binary rather than trusting either build tag.
      #
      #   internal/keysource/softtoken   F2 §7.3 / SPEC §16.6
      #   internal/cli.RunSignWithoutConsent
      #   internal/cli.RunSignDigest
      #                                  SPEC §18.2: no signature without
      #                                  human approval, and no flag,
      #                                  configuration or header bypasses
      #                                  the consent screen.
      #
      # The second used to be proved only incidentally — it was reachable
      # as `liro-bridge sign` and nothing looked for it — and it is named
      # here so that a future change putting it back into a release build
      # goes red for the reason it is wrong, not for a symbol that
      # happens to travel with it.
      #
      # The third is the same defect one command over (D-227): a
      # signature over an attacker-chosen digest is a signature over an
      # attacker-chosen document, and SPEC §6.6's consent screen cannot
      # be built in front of a digest, which has no document count, no
      # file names and no batch to fingerprint.
      #
      # Both directions are checked. A check that only looks for absence
      # passes for the wrong reason the moment the build tag itself
      # breaks: a typo turning `//go:build softtoken` into an ordinary
      # comment would make the symbols vanish even WITH the tag, and the
      # "absent" half would stay green forever.
      - name: the soft token and the no-consent signing paths are absent from a release build
        run: |
          set -eu
          symbols='internal/keysource/softtoken internal/cli.RunSignWithoutConsent internal/cli.RunSignDigest'

          go build -o dist/liro-bridge-no-softtoken ./cmd/liro-bridge
          go tool nm dist/liro-bridge-no-softtoken > dist/nm-release.txt
          go build -tags softtoken -o dist/liro-bridge-with-softtoken ./cmd/liro-bridge
          go tool nm dist/liro-bridge-with-softtoken > dist/nm-tagged.txt

          for sym in $symbols; do
            if grep -q "$sym" dist/nm-release.txt; then
              echo "FAIL: a release-shaped binary contains $sym"
              grep "$sym" dist/nm-release.txt | head
              exit 1
            fi
            echo "OK: no $sym in a release-shaped build"

            if ! grep -q "$sym" dist/nm-tagged.txt; then
              echo "FAIL: $sym is missing even WITH the softtoken tag — this check's own methodology is broken"
              exit 1
            fi
            echo "OK: $sym is present when the tag is passed"
          done
        env:
          CGO_ENABLED: 0

      # This is F2's exit condition (F2 §6.1): a signature produced by
      # sign-digest verifies with OpenSSL, a tool that shares no code
      # with this project, with no hardware present at all.
      #
      # It runs against the softtoken build, which since F9b is the only
      # build that has `sign-digest` at all (D-227). Nothing about this
      # step changed: it already built and used dist/liro-bridge-softtoken.
      - name: sign-digest verifies with OpenSSL against the soft token
        run: |
          go build -tags softtoken -o dist/liro-bridge-softtoken ./cmd/liro-bridge
          go run ./scripts/gentestkeys /tmp/softtoken

          export LIRO_SOFTTOKEN_P12=/tmp/softtoken/test.p12
          export LIRO_SOFTTOKEN_PASSWORD=liro-softtoken-test
          export LOCALAPPDATA=/tmp/liro-appdata
          export HOME=/tmp/liro-home
          export XDG_CONFIG_HOME=/tmp/liro-home/config

          echo "liro-bridge F2 CI verification" > /tmp/input.txt
          DIGEST=$(openssl dgst -sha256 /tmp/input.txt | awk '{print $2}')

          THUMBPRINT=$(dist/liro-bridge-softtoken certs --json | jq -r '.certificates[] | select(.isTestKey==true) | .thumbprint')
          test -n "$THUMBPRINT"

          dist/liro-bridge-softtoken certs --json | jq -r --arg tp "$THUMBPRINT" \
            '.certificates[] | select(.thumbprint == $tp) | .pem' > /tmp/cert.pem

          dist/liro-bridge-softtoken sign-digest --thumbprint "$THUMBPRINT" --digest "$DIGEST" --out /tmp/sig.bin

          openssl x509 -in /tmp/cert.pem -pubkey -noout > /tmp/pub.pem
          openssl dgst -sha256 -verify /tmp/pub.pem -signature /tmp/sig.bin /tmp/input.txt | tee /tmp/verify.out
          grep -q "Verified OK" /tmp/verify.out
        env:
          CGO_ENABLED: 0

      # F3 §16.5/SPEC §16.5: the PDF parser accepts foreign input and must
      # never panic, allocate unboundedly, or loop forever on it. 60s per
      # push/PR is a floor, not a substitute for the longer local runs
      # this phase's report cites (12.6M+18M executions clean) — it exists
      # so a future regression is caught automatically, not only when
      # someone remembers to fuzz by hand again.
      - name: fuzz internal/pades/pdf.FuzzParse
        run: go test ./internal/pades/pdf/... -run=^$ -fuzz=FuzzParse -fuzztime=60s
        env:
          CGO_ENABLED: 0

      # F3's own exit condition, automated the same way F2's was: sign a
      # PDF with the soft token (no hardware, no network credential
      # needed for this step — B-B, no TSA), and check the result with
      # OpenSSL, a tool sharing no code with this project, exactly like
      # F2 §6.1's sign-digest check. This is this project's own
      # independent verifier's job too, run right after for the same
      # reason F3 §16.4 asks for it in CI.
      #
      # It signs through `sign-no-consent`, not `sign`. `sign` shows the
      # consent window in every build (SPEC §18.2/§4.3) and there is no
      # human on a CI runner; the path with no window exists only in a
      # build made with the softtoken tag, under a name that says what
      # it is, and the step above proves a release binary does not carry
      # it.
      - name: sign a PDF and verify it with OpenSSL and the independent verifier
        run: |
          go build -tags softtoken -o dist/liro-bridge-softtoken ./cmd/liro-bridge
          go run ./scripts/gentestkeys /tmp/softtoken

          export LIRO_SOFTTOKEN_P12=/tmp/softtoken/test.p12
          export LIRO_SOFTTOKEN_PASSWORD=liro-softtoken-test
          export LOCALAPPDATA=/tmp/liro-appdata
          export HOME=/tmp/liro-home
          export XDG_CONFIG_HOME=/tmp/liro-home/config

          mkdir -p dist/ci-helpers/genpdf dist/ci-helpers/extract
          cat > dist/ci-helpers/genpdf/main.go << 'GOEOF'
          package main

          import (
          	"fmt"
          	"os"
          )

          // A minimal, valid, classic-xref PDF — the same shape this
          // project's own tests build (internal/pades/pdf's fixtures_test.go
          // and internal/pades's own test helpers), with byte offsets
          // computed here rather than hand-typed in a shell heredoc.
          func main() {
          	var buf []byte
          	offsets := map[int]int{}
          	write := func(num int, body string) {
          		offsets[num] = len(buf)
          		buf = append(buf, []byte(fmt.Sprintf("%d 0 obj\n%s\nendobj\n", num, body))...)
          	}
          	buf = append(buf, []byte("%PDF-1.4\n")...)
          	write(1, "<< /Type /Catalog /Pages 2 0 R >>")
          	write(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>")
          	write(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << >> /Contents 4 0 R >>")
          	content := "BT /F1 12 Tf 72 712 Td (Hello) Tj ET"
          	offsets[4] = len(buf)
          	buf = append(buf, []byte(fmt.Sprintf("4 0 obj\n<< /Length %d >>\nstream\n%s\nendstream\nendobj\n", len(content), content))...)
          	xrefStart := len(buf)
          	buf = append(buf, []byte("xref\n0 5\n0000000000 65535 f \n")...)
          	for i := 1; i <= 4; i++ {
          		buf = append(buf, []byte(fmt.Sprintf("%010d %05d n \n", offsets[i], 0))...)
          	}
          	buf = append(buf, []byte(fmt.Sprintf("trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF", xrefStart))...)
          	if err := os.WriteFile(os.Args[1], buf, 0o644); err != nil {
          		panic(err)
          	}
          }
          GOEOF
          go run ./dist/ci-helpers/genpdf /tmp/input.pdf

          THUMBPRINT=$(dist/liro-bridge-softtoken certs --json | jq -r '.certificates[] | select(.isTestKey==true) | .thumbprint')
          test -n "$THUMBPRINT"

          # --on-tsa-failure b-b because this step deliberately configures
          # no timestamp authority. Since D-067, "a level was requested and
          # no TSA is configured" is a failure rather than a silent
          # downgrade (SPEC §18.11), and --level defaults to b-lt — so
          # without this flag the command correctly aborts. The flag is
          # how a caller says "B-B is what I want here", which is exactly
          # what this step means.
          dist/liro-bridge-softtoken sign-no-consent --in /tmp/input.pdf --out /tmp/signed.pdf --thumbprint "$THUMBPRINT" --force --on-tsa-failure b-b

          cat > dist/ci-helpers/extract/main.go << 'GOEOF'
          package main

          import (
          	"fmt"
          	"os"

          	"github.com/veljaos/liro-bridge/internal/pades/verify"
          )

          func main() {
          	data, err := os.ReadFile(os.Args[1])
          	if err != nil {
          		panic(err)
          	}
          	slots, err := verify.FindSignatures(data)
          	if err != nil || len(slots) != 1 {
          		panic(fmt.Sprintf("FindSignatures: %v (slots=%d)", err, len(slots)))
          	}
          	r := verify.VerifySignature(data, slots[0])
          	if len(r.Errors) > 0 || !r.ByteRangeDigestOK || !r.SignatureOK || !r.SigningCertificateOK {
          		panic(fmt.Sprintf("independent verifier rejected the signature: %+v errors=%v", r, r.Errors))
          	}
          	fmt.Println("independent verifier: OK")

          	b, c, d := slots[0].ByteRange[1], slots[0].ByteRange[2], slots[0].ByteRange[3]
          	if err := os.WriteFile(os.Args[2], slots[0].CMS, 0o644); err != nil {
          		panic(err)
          	}
          	content := append(append([]byte{}, data[:b]...), data[c:c+d]...)
          	if err := os.WriteFile(os.Args[3], content, 0o644); err != nil {
          		panic(err)
          	}
          }
          GOEOF
          go run ./dist/ci-helpers/extract /tmp/signed.pdf /tmp/sig.der /tmp/sig.content

          openssl cms -verify -inform DER -in /tmp/sig.der -noverify -binary -content /tmp/sig.content -out /dev/null
        env:
          CGO_ENABLED: 0

      # Cross-compilation must work from day one (F0 §8), even though only
      # Windows has a real implementation so far. CGO_ENABLED=0 here keeps
      # these builds honest about not depending on a C toolchain, per the
      # "no cgo until phase 11" rule in F0 §10.
      - name: build windows/amd64
        run: go build -o dist/ ./...
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64

      - name: build darwin/arm64
        run: go build -o dist/ ./...
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64

      - name: build linux/amd64
        run: go build -o dist/ ./...
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64

  # windows-latest is the only runner that actually compiles and runs
  # this project's *_windows.go files (internal/ui's COM/WebView2 host,
  # the tray, cmd/liro-bridge's interactive/settings/certificates/audit
  # log windows). The ubuntu job above cross-compiles windows/amd64
  # (build windows/amd64, above) but a cross-compiled build is never
  # executed, so it proves the package compiles, not that a window ever
  # renders or that a click ever reaches Go — every one of the F5
  # first-real-run findings this job exists to catch (empty window
  # text: the Go-level view-model tests passed while ExecuteScript
  # raced Navigate; approve/cancel silently dropped: bridge.js's
  # postMessage(JSON.stringify(...)) double-encoded every page->Go
  # message) lived entirely in code this project's CI had never once
  # built with GOOS=windows, let alone run. See docs/decisions.md.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet -unsafeptr=false ./...

      - name: test (real WebView2 windows, no hardware)
        # -tags softtoken so the interactive consent/sign path
        # (cmd/liro-bridge's *_windows_test.go) can exercise a real
        # window, a real certificate list and a real signature with no
        # smart card present — the same soft token the ubuntu job's
        # sign-digest/PDF-signing steps already rely on for the same
        # reason (F2 §3). windows-latest ships the WebView2 Evergreen
        # Runtime (bundled with Microsoft Edge) that every window this
        # test suite creates depends on.
        run: go test -tags softtoken ./... -count=1
        env:
          CGO_ENABLED: 0

      # D-221 closed a defect in the packaging test — it resolved
      # npm-cli.js by assuming the Windows layout, which is wrong on
      # every other operating system — and recorded that the fix left a
      # gap pointing the other way: this job ran Go only, so
      # sdk-typescript on ubuntu-latest was the only place that suite
      # ran anywhere. Both npm-cli.js layouts resolve now, but the
      # Windows branch was exercised by a person and the POSIX branch by
      # CI, which is exactly the defect D-221 records with the platforms
      # swapped. A check that only runs where it was written is not
      # evidence about where it will run.
      #
      # The version is pinned rather than taken as latest, for the reason
      # the golangci-lint comment above already gives: CI's verdict must
      # not change overnight with no commit. It is the same version the
      # sdk-typescript job pins, so the two jobs test the same Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: install the build tools (SDK)
        working-directory: sdk/typescript
        run: npm ci

      - name: the committed dist/ is what src/ produces (Windows)
        working-directory: sdk/typescript
        run: npm run check-build

      - name: test (SDK, Windows)
        working-directory: sdk/typescript
        run: npm test

  # The TypeScript SDK. Its own job rather than steps on the ubuntu one,
  # because it needs Node rather than Go and because a red SDK should
  # say "SDK" rather than sending somebody to read a Go job's log.
  #
  # The committed build output is the load-bearing check here.
  # `sdk/typescript/dist/` is what an integrator gets — installing from
  # GitHub runs no build step — so a `dist/` that is not what `src/`
  # produces ships silently. This project has already had one generated
  # file drift from its generator, and running the generator would have
  # deleted a block five screens depended on (docs/decisions.md D-183).
  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The oldest Node this SDK supports (F8 §2) and the one it is
          # therefore tested on: a suite that only ever runs on the
          # newest Node is not evidence about the version the package
          # says it accepts.
          node-version: '18'

      # `npm ci` rather than `npm install`: package-lock.json is
      # committed and the compiler version is pinned, so the build in CI
      # is the build a developer ran.
      - name: install the build tools
        run: npm ci

      - name: the committed dist/ is what src/ produces
        run: npm run check-build

      - name: test
        run: npm test

      # Zero runtime dependencies is a property, not an aspiration: this
      # package is installed into applications that handle a signing
      # secret, and every dependency here would be one of theirs.
      - name: no runtime dependencies
        run: |
          deps="$(node -p 'JSON.stringify({...require("./package.json").dependencies, ...require("./package.json").peerDependencies})')"
          if [ "$deps" != "{}" ]; then
            echo "the SDK has runtime dependencies: $deps"
            exit 1
          fi

      # The end of the argument: pack the repository root exactly as npm
      # would for `npm install github:veljaos/liro-bridge`, install the
      # tarball into an empty project, and import '@liro/bridge' both
      # ways. A package that passes its own tests and cannot be
      # installed is this project's recurring failure mode, one layer
      # over.
      - name: install it the way an integrator does
        working-directory: .
        run: |
          set -eu
          work="$(mktemp -d)"
          npm pack --silent --pack-destination "$work" . >/dev/null
          cd "$work"
          echo '{"name":"consumer","version":"1.0.0","type":"module","private":true}' > package.json
          npm install --no-audit --no-fund --silent ./liro-bridge-*.tgz
          echo "import { LiroBridge, FileSecretStore, LiroError } from '@liro/bridge';
          if (typeof LiroBridge.connect !== 'function') { throw new Error('no LiroBridge'); }
          if (typeof FileSecretStore !== 'function') { throw new Error('no FileSecretStore'); }
          if (typeof LiroError !== 'function') { throw new Error('no LiroError'); }
          console.log('esm ok');" > use.mjs
          node use.mjs
          echo "const m = require('@liro/bridge');
          if (typeof m.LiroBridge.connect !== 'function') { throw new Error('no LiroBridge'); }
          console.log('cjs ok');" > use.cjs
          node use.cjs
          installed="$(ls node_modules | grep -v '^\.' | tr '\n' ' ')"
          if [ "$installed" != "@liro " ]; then
            echo "installing this package brought other packages with it: $installed"
            exit 1
          fi
