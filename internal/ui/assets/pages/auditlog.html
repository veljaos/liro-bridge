<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://liro.local/tokens.css" />
<link rel="stylesheet" href="https://liro.local/intents.css" />
<link rel="stylesheet" href="https://liro.local/pages/auditlog.css" />
</head>
<body class="liro-page">

<main>
  <p class="liro-display liro-fixed-region" data-i18n="auditwindow.title"></p>
  <div id="empty" class="liro-text-small" hidden data-i18n="auditwindow.empty"></div>

  <section id="entry-list" class="liro-scroll-region" role="list" aria-label="Audit log entries"></section>

  <!-- Export sits beside Close because this is where a person is when
       they decide they want the log. It writes the same two files
       Settings' own Export writes, through the same code. -->
  <div id="action-status" class="liro-text-small liro-fixed-region" hidden>
    <p id="action-status-text" class="liro-status-text"></p>
    <div id="action-status-files" class="liro-status-files" hidden></div>
  </div>
  <div class="actions liro-fixed-region">
    <button id="export-btn" class="liro-btn liro-btn-secondary" data-i18n="auditwindow.export"></button>
    <button id="close-btn" class="liro-btn liro-btn-primary" data-i18n="settings.close"></button>
  </div>
</main>

<script src="https://liro.local/bridge.js"></script>
<script src="https://liro.local/pages/auditlog.js"></script>
</body>
</html>
