<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://liro.invalid/tokens.css" />
<link rel="stylesheet" href="https://liro.invalid/intents.css" />
<link rel="stylesheet" href="https://liro.invalid/pages/pairing.css" />
</head>
<body class="liro-page">

<!-- The pairing window (F7 §2.1).

     There is no Allow button, and that is the whole design. Approval
     is not a click here: it is the six digits below travelling through
     a person, off this screen and into the application that asked. A
     button would prove that somebody was at the machine; the code
     proves that somebody was at the machine AND is talking to the
     application that asked, which is the thing worth proving.

     The name and the origin are shown exactly as the application
     declared them — no prettifying, no stripping of the scheme — so a
     person who sees http:// where they expected https:// can notice
     (SPEC §6.2). -->
<main id="state-code">
  <!-- Two fields, each a quiet label above its value, and nothing else
       between them and the code (D-208). The label says what the value
       is, so the value does not have to say it in a sentence.

       The identity block — who is asking, and from where — is the one
       region of this page that scrolls. Both values in it are supplied
       by the caller and neither has a length this window controls: a
       name arrives at up to consent.MaxDisplayLength (120 characters)
       and an origin at up to api.MaxOriginLength (255). The code, the
       explanation and the button below it never move. -->
  <div class="identity liro-scroll-region">
    <div class="field">
      <p class="field-label" data-i18n="pairing.request_label"></p>
      <p class="field-value" id="app-name"></p>
    </div>

    <div class="field">
      <p class="field-label" data-i18n="pairing.origin_label"></p>
      <p class="field-value" id="app-origin"></p>
    </div>
  </div>

  <!-- The code, its label and its note are centred on the window's own
       axis, apart from the left-aligned table above: this is the thing
       being read out loud, not another field about who is asking. The
       note is two lines because it says two things — what to do with
       the number, and how long it lasts — and a sentence a person is
       meant to act on should not have to be found inside a paragraph. -->
  <div class="code-block">
    <p class="field-label" data-i18n="pairing.code_label"></p>
    <p id="pairing-code" class="pairing-code"></p>
    <div class="code-note liro-text-small liro-text-secondary">
      <p data-i18n="pairing.code_explain"></p>
      <p data-i18n="pairing.code_validity"></p>
    </div>
  </div>

  <div class="actions">
    <button id="deny-btn" class="liro-btn liro-btn-secondary" data-i18n="pairing.deny"></button>
  </div>
</main>

<!-- The connected screen: a mark, the word, the name, and the way out.
     The mark is drawn here rather than pulled from an icon library,
     because one glyph is not a dependency; its size and its colour both
     come from tokens, like every other value on these pages (SPEC
     §10.1). aria-hidden, because the word beside it already says
     "Connected" — a screen reader that announced both would say it
     twice. -->
<!-- The mark, the words, and the way out. Nothing else: this screen is
     on for the few seconds between a code being confirmed and somebody
     pressing Zatvori, and a mark and two words are read in one glance
     where a name and a sentence are read by nobody.

     The mark is lucide's circle-check-big, used as supplied. It strokes
     with currentColor and carries no colour of its own, so the green
     comes from .connected-check's own --liro-color-positive and there
     is no hex value in the markup — the same arrangement the mark it
     replaces already had. -->
<main id="state-connected" hidden>
  <svg id="connected-check" class="connected-check" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <path d="M21.801 10A10 10 0 1 1 17 3.335" />
    <path d="m9 11 3 3L22 4" />
  </svg>
  <p class="liro-display" id="connected-title" data-i18n="pairing.connected_title"></p>
  <div class="actions">
    <button id="close-btn" class="liro-btn liro-btn-primary" data-i18n="pairing.close"></button>
  </div>
</main>

<script src="https://liro.invalid/bridge.js"></script>
<script src="https://liro.invalid/pages/pairing.js"></script>
</body>
</html>
