<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://liro.invalid/tokens.css" />
<link rel="stylesheet" href="https://liro.invalid/intents.css" />
<link rel="stylesheet" href="https://liro.invalid/pages/consent.css" />
</head>
<body class="liro-page">

<!-- The signing flow's certificate step: who is signing, how many
     documents, the fingerprint and the file list behind Details, and
     the approval. It is one page of one window, reached by that window
     navigating to it — not a window of its own opening on top of
     another one.

     Nothing about SPEC §6.5 changes for being a step. The approval is
     still a deliberate press of a button nobody focused for the user,
     Cancel still refuses, and the window is still the agent's own. -->
<header id="step-header" class="liro-steps liro-fixed-region" role="group" hidden>
  <button id="step-back-btn" class="liro-btn liro-btn-quiet liro-btn-compact liro-steps-back" hidden></button>
  <div id="step-dots" class="liro-steps-dots" aria-hidden="true"></div>
</header>

<main id="state-waiting">
  <div class="waiting-header liro-fixed-region">
    <p class="liro-display" id="signer-name"></p>
    <p class="liro-text-secondary" id="document-count"></p>

    <div id="select-prompt" class="liro-text-small" data-i18n="consent.select_certificate_prompt"></div>
    <div id="cert-notice" class="liro-text-small" hidden></div>
  </div>

  <section id="cert-list" class="liro-scroll-region" role="listbox" aria-label="Certificates"></section>

  <div class="waiting-footer liro-fixed-region">
    <div class="liro-row secondary-row">
      <span class="liro-text-secondary" data-i18n="consent.application_label"></span>
      <span class="liro-text-secondary" id="application-name"></span>
    </div>

    <details class="liro-disclosure" id="details">
      <summary data-i18n="consent.details_toggle"></summary>
      <div class="liro-card liro-text-small">
        <div class="liro-row fingerprint-row">
          <span data-i18n="consent.fingerprint_label"></span>
          <span class="fingerprint-value">
            <code id="fingerprint"></code>
            <button id="copy-fingerprint-btn" class="liro-btn liro-btn-secondary liro-btn-compact" data-i18n="consent.copy_fingerprint"></button>
          </span>
        </div>
        <div data-i18n="consent.files_label"></div>
        <ul id="file-list"></ul>
        <div id="file-overflow"></div>
      </div>
    </details>

    <!-- F7 §7.4: a request that arrived over the protocol expires if
         nobody answers, and the last thirty seconds say so — so the
         person sees it is about to go rather than finding it gone. A
         batch a person started here has no clock and no line. -->
    <div id="countdown" class="liro-text-small liro-outcome-warning" role="status" hidden></div>

    <div class="actions">
      <button id="cancel-btn" class="liro-btn liro-btn-secondary" data-i18n="consent.cancel"></button>
      <button id="approve-btn" class="liro-btn liro-btn-primary" data-i18n="consent.approve" disabled></button>
    </div>
  </div>
</main>

<script src="https://liro.invalid/bridge.js"></script>
<script src="https://liro.invalid/pages/consent.js"></script>
</body>
</html>
